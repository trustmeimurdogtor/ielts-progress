<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Progress</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-alt: #fafafa;
    --border: #e9e9e7;
    --border-row: #eeeeee;
    --text: #37352f;
    --muted: #787774;
    --accent: #2383e2;
    --accent-hover: #1b6ec2;
    --accent-fill: rgba(35, 131, 226, 0.12);
    --target: #e67700;
    --success: #2f9e44;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
    --grid: rgba(0, 0, 0, 0.06);
}

[data-theme="dark"] {
    --bg: #191919;
    --surface: #222222;
    --surface-alt: #292929;
    --border: #333333;
    --border-row: #2e2e2e;
    --text: #ebebeb;
    --muted: #9b9a97;
    --accent: #4dabf7;
    --accent-hover: #339af0;
    --accent-fill: rgba(77, 171, 247, 0.16);
    --target: #ffa94d;
    --success: #51cf66;
    --shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    --grid: rgba(255, 255, 255, 0.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    padding: 40px;
    transition: background-color 0.2s ease, color 0.2s ease;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
}

h1 {
    font-size: 28px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.target-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    box-shadow: var(--shadow);
    font-size: 13.5px;
}

.target-control label {
    color: var(--muted);
    font-weight: 500;
}

.target-control select {
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
}

.target-control select:focus {
    border-color: var(--target);
}

.theme-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.theme-btn:hover {
    background: var(--surface-alt);
}

.summary-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.summary-main {
    display: flex;
    align-items: baseline;
    gap: 14px;
}

.overall-label {
    font-size: 14px;
    color: var(--muted);
}

.overall-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
}

.target-status {
    font-size: 14px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
}

.target-status.achieved {
    color: var(--success);
}

.target-status.pending {
    color: var(--target);
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
}

.card-title {
    color: var(--muted);
    font-size: 14px;
}

.card-score {
    font-size: 32px;
    font-weight: 700;
    margin-top: 8px;
}

.input-box,
.chart-box,
.history {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
}

.history {
    padding: 0;
    overflow: hidden;
    margin-bottom: 0;
}

.chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
}

.section-title {
    font-size: 18px;
    margin-bottom: 0;
}

.input-box .section-title {
    margin-bottom: 16px;
}

.legend-hint {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
}

.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.swatch-line {
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
}

.swatch-target {
    width: 16px;
    height: 0;
    border-top: 2.5px dashed var(--target);
}

.score-form {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    align-items: end;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
}

.field input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-size: 14px;
    outline: none;
}

.field input:focus {
    border-color: var(--accent);
}

.submit-btn {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    height: 38px;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background: var(--accent-hover);
}

.form-note {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px 18px;
    text-align: left;
    font-size: 14px;
}

th {
    background: var(--surface-alt);
    color: var(--muted);
    font-weight: 600;
}

tr:not(:last-child) {
    border-bottom: 1px solid var(--border-row);
}

.delete-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
}

.delete-btn:hover {
    color: #e03131;
    border-color: #e03131;
}

@media (max-width: 820px) {
    body {
        padding: 20px;
    }

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .score-form {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>📚 IELTS Progress </h1>
        <div class="header-actions">
            <div class="target-control">
                <label for="targetSelect"> Target Band:</label>
                <select id="targetSelect">
                    <option value="4.0">4.0</option>
                    <option value="4.5">4.5</option>
                    <option value="5.0">5.0</option>
                    <option value="5.5">5.5</option>
                    <option value="6.0">6.0</option>
                    <option value="6.5">6.5</option>
                    <option value="7.0">7.0</option>
                    <option value="7.5">7.5</option>
                    <option value="8.0" selected>8.0</option>
                    <option value="8.5">8.5</option>
                    <option value="9.0">9.0</option>
                </select>
            </div>
            <button type="button" id="themeToggle" class="theme-btn">🌙</button>
        </div>
    </div>

    <div class="summary-banner">
        <div class="summary-main">
            <span class="overall-label">Latest Overall Band:</span>
            <span class="overall-value" id="latestOverall">7.5</span>
        </div>
        <div class="target-status pending" id="targetStatus"></div>
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-title">Listening</div>
            <div class="card-score" id="cardListening">7.5</div>
        </div>

        <div class="card">
            <div class="card-title">Reading</div>
            <div class="card-score" id="cardReading">8.0</div>
        </div>

        <div class="card">
            <div class="card-title">Writing</div>
            <div class="card-score" id="cardWriting">6.5</div>
        </div>

        <div class="card">
            <div class="card-title">Speaking</div>
            <div class="card-score" id="cardSpeaking">7.0</div>
        </div>
    </div>

    <div class="input-box">
        <h2 class="section-title">Add Mock / Test Score</h2>
        <form id="scoreForm" class="score-form">
            <div class="field">
                <label for="dateInput">Date</label>
                <input type="text" id="dateInput" placeholder="e.g. 05/05" required>
            </div>
            <div class="field">
                <label for="listeningInput">Listening</label>
                <input type="number" id="listeningInput" min="0" max="9" step="0.5" placeholder="0 - 9" required>
            </div>
            <div class="field">
                <label for="readingInput">Reading</label>
                <input type="number" id="readingInput" min="0" max="9" step="0.5" placeholder="0 - 9" required>
            </div>
            <div class="field">
                <label for="writingInput">Writing</label>
                <input type="number" id="writingInput" min="0" max="9" step="0.5" placeholder="0 - 9" required>
            </div>
            <div class="field">
                <label for="speakingInput">Speaking</label>
                <input type="number" id="speakingInput" min="0" max="9" step="0.5" placeholder="0 - 9" required>
            </div>
            <button type="submit" class="submit-btn">+ Add Score</button>
        </form>
        <p class="form-note"></p>
    </div>

    <div class="chart-box">
        <div class="chart-header">
            <h2 class="section-title">Overall Progress</h2>
            <div class="legend-hint">
                <span class="legend-item"><span class="swatch-line"></span>Overall Band</span>
                <span class="legend-item"><span class="swatch-target"></span>Target Band (<span id="legendTarget">8.0</span>)</span>
            </div>
        </div>
        <canvas id="ieltsChart"></canvas>
    </div>

    <div class="history">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>L / R / W / S</th>
                    <th>Overall Band</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

</div>

<script>
const STORAGE_KEY = 'ielts_tracker_entries_v1';
const THEME_KEY = 'ielts_tracker_theme_v1';
const TARGET_KEY = 'ielts_tracker_target_v1';

const defaultEntries = [
    { date: '01/01', listening: 6.0, reading: 6.5, writing: 5.5, speaking: 6.0, overall: 6.0 },
    { date: '01/02', listening: 6.5, reading: 7.0, writing: 6.0, speaking: 6.5, overall: 6.5 },
    { date: '01/03', listening: 7.0, reading: 7.5, writing: 6.0, speaking: 7.0, overall: 7.0 },
    { date: '01/04', listening: 7.5, reading: 8.0, writing: 6.5, speaking: 7.0, overall: 7.5 }
];

function loadEntries() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...defaultEntries];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : [...defaultEntries];
    } catch {
        return [...defaultEntries];
    }
}

function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function loadTargetBand() {
    const saved = parseFloat(localStorage.getItem(TARGET_KEY));
    if (!Number.isNaN(saved) && saved >= 4.0 && saved <= 9.0) {
        return saved.toFixed(1);
    }
    return '8.0';
}

function calcIeltsOverall(l, r, w, s) {
    const avg = (l + r + w + s) / 4;
    return (Math.round(avg * 2) / 2).toFixed(1);
}

let entries = loadEntries();
let targetBand = loadTargetBand();

const targetSelect = document.getElementById('targetSelect');
targetSelect.value = targetBand;
const themeToggle = document.getElementById('themeToggle');
function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function applyTheme(theme) {
    if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '☀️ Light Mode';
    } else {
        document.documentElement.removeAttribute('data-theme');
        themeToggle.textContent = '🌙 Dark Mode';
    }
    localStorage.setItem(THEME_KEY, theme);
    updateChartTheme();
}
const ctx = document.getElementById('ieltsChart');
const ieltsChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'Overall Score',
                data: [],
                borderColor: '#2383e2',
                backgroundColor: 'rgba(35,131,226,0.12)',
                borderWidth: 3,
                tension: 0.4,
                fill: true,
                pointRadius: 4
            },
            {
                label: 'Target Band',
                data: [],
                borderColor: '#e67700',
                backgroundColor: 'transparent',
                borderWidth: 2,
                borderDash: [6, 6],
                pointRadius: 0,
                tension: 0,
                fill: false
            }
        ]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                display: false
            }
        },
        scales: {
            y: {
                min: 4,
                max: 9,
                ticks: { stepSize: 0.5 }
            },
            x: {}
        }
    }
});

function updateChartTheme() {
    const accent = getCssVar('--accent');
    const fill = getCssVar('--accent-fill');
    const targetColor = getCssVar('--target');
    const muted = getCssVar('--muted');
    const grid = getCssVar('--grid');

    ieltsChart.data.datasets[0].borderColor = accent;
    ieltsChart.data.datasets[0].backgroundColor = fill;
    ieltsChart.data.datasets[1].borderColor = targetColor;
    ieltsChart.options.scales.y.ticks.color = muted;
    ieltsChart.options.scales.x.ticks.color = muted;
    ieltsChart.options.scales.y.grid.color = grid;
    ieltsChart.options.scales.x.grid.color = grid;
    ieltsChart.update();
}

function renderTargetSummary(latestOverallNum) {
    const targetNum = parseFloat(targetBand);
    const diff = Number((targetNum - latestOverallNum).toFixed(1));
    const statusEl = document.getElementById('targetStatus');
    document.getElementById('legendTarget').textContent = targetNum.toFixed(1);

    if (diff <= 0) {
        statusEl.textContent = `🎉 Đã đạt Target ${targetNum.toFixed(1)}!`;
        statusEl.classList.remove('pending');
        statusEl.classList.add('achieved');
    } else {
        statusEl.textContent = `still lacking ${diff.toFixed(1)} compared to target band ${targetNum.toFixed(1)}`;
        statusEl.classList.remove('achieved');
        statusEl.classList.add('pending');
    }
}

function renderAll() {
    const latest = entries[entries.length - 1];
    const latestOverallNum = Number(latest.overall);

    document.getElementById('latestOverall').textContent = latestOverallNum.toFixed(1);
    document.getElementById('cardListening').textContent = Number(latest.listening).toFixed(1);
    document.getElementById('cardReading').textContent = Number(latest.reading).toFixed(1);
    document.getElementById('cardWriting').textContent = Number(latest.writing).toFixed(1);
    document.getElementById('cardSpeaking').textContent = Number(latest.speaking).toFixed(1);

    renderTargetSummary(latestOverallNum);

    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    entries.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${item.date}</td>
            <td>${Number(item.listening).toFixed(1)} / ${Number(item.reading).toFixed(1)} / ${Number(item.writing).toFixed(1)} / ${Number(item.speaking).toFixed(1)}</td>
            <td><strong>${Number(item.overall).toFixed(1)}</strong></td>
            <td>
                ${entries.length > 1
                    ? `<button type="button" class="delete-btn" data-index="${index}">Delete</button>`
                    : ''}
            </td>
        `;
        tbody.appendChild(tr);
    });

    const targetNum = parseFloat(targetBand);
    ieltsChart.data.labels = entries.map(e => e.date);
    ieltsChart.data.datasets[0].data = entries.map(e => Number(e.overall));
    ieltsChart.data.datasets[1].data = entries.map(() => targetNum);
    ieltsChart.update();
}

targetSelect.addEventListener('change', (e) => {
    targetBand = e.target.value;
    localStorage.setItem(TARGET_KEY, targetBand);
    renderAll();
});

document.getElementById('scoreForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const date = document.getElementById('dateInput').value.trim();
    const listening = parseFloat(document.getElementById('listeningInput').value);
    const reading = parseFloat(document.getElementById('readingInput').value);
    const writing = parseFloat(document.getElementById('writingInput').value);
    const speaking = parseFloat(document.getElementById('speakingInput').value);

    const overall = calcIeltsOverall(listening, reading, writing, speaking);

    entries.push({ date, listening, reading, writing, speaking, overall });
    saveEntries(entries);
    renderAll();

    e.target.reset();
});

document.getElementById('historyBody').addEventListener('click', (e) => {
    if (!e.target.classList.contains('delete-btn')) return;
    const idx = Number(e.target.dataset.index);
    entries.splice(idx, 1);
    saveEntries(entries);
    renderAll();
});

themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    applyTheme(isDark ? 'light' : 'dark');
});
const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
renderAll();
applyTheme(savedTheme);
</script>
</body>
</html>
